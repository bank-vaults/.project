    - "ghcr.io/bank-vaults/bank-vaults"
    - "ghcr.io/bank-vaults/vault-operator"
    - "ghcr.io/bank-vaults/vault-secrets-webhook"
    - "ghcr.io/bank-vaults/secrets-webhook"
    - "ghcr.io/bank-vaults/secret-init"
    - "ghcr.io/bank-vaults/secret-sync"
    - "ghcr.io/bank-vaults/vault-secrets-reloader"
    - "ghcr.io/bank-vaults/vault-env"
  helm:
    - "oci://ghcr.io/bank-vaults/helm-charts/vault-operator"
    - "oci://ghcr.io/bank-vaults/helm-charts/vault-secrets-webhook"
    - "oci://ghcr.io/bank-vaults/helm-charts/secrets-webhook"
    - "oci://ghcr.io/bank-vaults/helm-charts/vault-secrets-reloader"


