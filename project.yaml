# .project metadata for Bank-Vaults
# Documentation: https://github.com/cncf/automation/tree/main/utilities/dot-project

schema_version: "1.0.0"
slug: "bank-vaults"
name: "Bank-Vaults"
description: "Bank-Vaults is a Vault swiss-army knife: a K8s operator, Go client with automatic token renewal, automatic configuration, multiple unseal options and more. A CLI tool to init, unseal and configure Vault (auth methods, secret engines). Direct secret injection into Pods."
type: "project"
project_lead: "csatib02"
slack_channels: 
  - name: "#bank-vaults"
    primary: true

maturity_log:
  - phase: "sandbox"
    date: "2026-03-18T14:28:33Z"
    issue: "https://github.com/cncf/sandbox/issues/142"

repositories:
  - "https://github.com/bank-vaults/bank-vaults"
  - "https://github.com/bank-vaults/vault-operator"
  - "https://github.com/bank-vaults/vault-secrets-webhook"
  - "https://github.com/bank-vaults/secrets-webhook"
  - "https://github.com/bank-vaults/secret-init"
  - "https://github.com/bank-vaults/secret-sync"
  - "https://github.com/bank-vaults/vault-env"
  - "https://github.com/bank-vaults/vault-sdk"
  - "https://github.com/bank-vaults/vault-secrets-reloader"
  - "https://github.com/bank-vaults/vault-helm-chart"
  - "https://github.com/bank-vaults/bank-vaults.dev"

website: "https://bank-vaults.dev/"

artwork: "https://github.com/cncf/artwork/tree/main/projects/bank-vaults"

adopters:
